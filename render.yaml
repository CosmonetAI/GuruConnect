# Two services only: frontend and API with supervised durable processing.
# Supabase remains the external Auth/database/private Storage.
# Values marked sync:false are configured in Render, never committed.
services:
  - type: web
    name: guruconnect-frontend
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build:production
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: microphone=(self), camera=(), geolocation=(), payment=(), display-capture=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
  - type: web
    name: guruconnect-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    maxShutdownDelaySeconds: 60
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: CREDENTIAL_KEY_VERSION
        value: "1"
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
      - key: POOL_MAX_SIZE
        value: "5"
      - key: UPLOAD_MAX_BYTES
        value: "6000000"
      - key: PREAUTH_RATE_LIMIT_PER_MINUTE
        value: "5000"
      - key: MAX_CONCURRENT_REQUESTS
        value: "64"
      - key: EMBEDDED_PROCESSING_ENABLED
        value: "true"
      - key: PROCESSING_CONCURRENCY
        value: "4"
      - key: MANAGED_PROVIDER_CONCURRENCY
        value: "4"
      - key: PROCESSING_SHUTDOWN_SECONDS
        value: "15"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: ZOHO_ACCOUNTS_URL
        value: https://accounts.zoho.com
      - key: ZOHO_API_DOMAIN
        value: https://www.zohoapis.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: ZOHO_REFRESH_CRON_SECRET
        sync: false
