[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "guruconnect-backend"
version = "1.0.0"
description = "GuruConnect enquiry, private recording and processing API"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["recorder*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../frontend/tests/backend"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
