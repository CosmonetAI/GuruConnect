name: Production checks
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-storage:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONPATH: backend
      ENVIRONMENT: development
      EMBEDDED_PROCESSING_ENABLED: "false"
      ELEVENLABS_API_KEY: ""
      OPENAI_API_KEY: ""
      DATABASE_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      CREDENTIAL_ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "${{ matrix.python-version }}", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - name: Install locked backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check local key locking, persistence, API and worker
        run: python -m pytest frontend/tests/unit/test_local_store.py frontend/tests/unit/test_local_worker.py frontend/tests/backend/test_local_api.py frontend/tests/backend/test_local_api_guards.py -q
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: backend:backend/inference
      ENVIRONMENT: development
      EMBEDDED_PROCESSING_ENABLED: "false"
      ELEVENLABS_API_KEY: ""
      OPENAI_API_KEY: ""
      DATABASE_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      CREDENTIAL_ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt}
      - name: Install locked dependencies and disposable database tools
        run: |
          npm --prefix frontend ci
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
          python -m pip install pip-audit==2.10.1
          sudo apt-get update
          sudo apt-get install -y postgresql-16 ffmpeg
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Check types, frontend, release configuration and backend isolation
        run: |
          npm --prefix frontend run check
          npm --prefix frontend test
          npm --prefix frontend run test:scripts
          npm --prefix frontend run test:backend -- --tb=short
          npm --prefix frontend run test:database
          backend/.venv/bin/ruff check --select E9,F backend/recorder backend/app backend/inference/inference
      - name: Check generated API contracts
        run: |
          npm --prefix frontend run contracts
          git diff --exit-code -- frontend/packages/contracts
      - name: Build and scan dependencies
        env:
          VITE_SUPABASE_URL: https://synthetic-fixture.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_never_live
          VITE_API_URL: https://synthetic-fixture-api.onrender.com
        run: |
          npm --prefix frontend run build:production
          npm --prefix frontend audit --audit-level=low
          python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip
          python -m pip_audit -r backend/requirements-dev.txt --no-deps --disable-pip
          docker build -f backend/Dockerfile -t guruconnect-ci .
      - name: Browser regression tests with synthetic microphone and no paid providers
        run: |
          cd frontend
          npx playwright install --with-deps chrome
          npm run test:browser
      - name: Retain failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-test-failures
          path: frontend/test-results/
          retention-days: 7
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Scan history for committed credentials with redacted output
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .
